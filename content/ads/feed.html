<title>Fog Feed</title>
<style>
  /* One light look on purpose: white ground, a single teal accent, Liquid Glass controls over video. */
  :root {
    color-scheme: light;
    --ground: #ffffff;
    --ink: #0e1b1d;
    --muted: #6a7a7c;
    --line: #e4eeed;
    --teal: #0f9488;
    --teal-soft: #e7f5f3;
    --warn: #b7791f;
    --bad: #c2413b;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --round: -apple-system, "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Reels: one full-screen clip per swipe. The video is edge to edge by request; controls float on glass. */
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.4 var(--ui); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* Liquid Glass: translucent fill, blur + saturation, a bright rim, and a specular sheen on top. */
  .glass {
    position: relative; isolation: isolate;
    background: rgba(255, 255, 255, .16);
    -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, .42);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 1px rgba(255,255,255,.18), 0 8px 24px rgba(0, 20, 22, .18);
    color: #fff;
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,0) 60%, rgba(255,255,255,.12) 100%);
  }
  .glass.light { background: rgba(255, 255, 255, .72); color: var(--ink); border-color: rgba(255,255,255,.9); box-shadow: inset 0 1px 0 #fff, 0 10px 30px rgba(0, 40, 38, .12); }
  .glass.tint { background: rgba(15, 148, 136, .55); border-color: rgba(190, 245, 238, .6); }
  .press { transition: transform .18s cubic-bezier(.2,.9,.3,1.4), background .2s; }
  .press:active { transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) { .press, .sheet, .toast { transition: none; animation: none; } }

  .wrap { max-width: 480px; margin-inline: auto; }
  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); width: min(480px, 100%); padding-inline: 14px; z-index: 20; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .logo { border-radius: 999px; padding: 8px 14px; }
  .logo { font: 700 21px/1 var(--round); letter-spacing: -.02em; }
  .logo i { font-style: normal; color: var(--teal); }
  .pillbtn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .pillbtn.glass.light { color: var(--teal); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 6px; vertical-align: 1px; }

  /* TikTok-style: a full-screen vertical pager. Swipe up (or wheel / arrow down) for the next clip. */
  .feed { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; background: #0c1516; }
  .feed::-webkit-scrollbar { display: none; }
  .post { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; justify-content: center; }
  .post .stage { width: min(480px, 100%); }
  .offer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(280px, calc(100% - 48px)); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; z-index: 7; animation: up .28s cubic-bezier(.2,.9,.3,1.1); }
  .offer b { font: 700 18px/1.2 var(--round); }
  .offer .row { width: 100%; }
  .offer small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stage { position: relative; width: 100%; max-width: 100%; height: 100%; overflow: hidden; background: #0c1516; }
  @media (min-width: 520px) { .stage { border-radius: 0; box-shadow: 0 0 0 1px var(--line); } }
  .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage.frozen video { filter: blur(6px) saturate(.9); transform: scale(1.04); }

  .chip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 62px); left: 12px; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; max-width: calc(100% - 80px); }
  .chip small { font-weight: 500; opacity: .8; }
  .chip.warn { top: calc(env(safe-area-inset-top, 0px) + 102px); font-size: 12px; font-weight: 500; }
  .sound { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 62px); right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; }
  .sound svg, .bar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* The same four actions on every post. */
  .bar { position: absolute; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; border-radius: 26px; z-index: 5; }
  .bar button { border: 0; background: transparent; border-radius: 20px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; color: #fff; }
  .bar button:hover { background: rgba(255,255,255,.14); }
  .bar button.on { background: rgba(255,255,255,.9); color: var(--teal); }
  .bar button:disabled { opacity: .5; cursor: default; }

  .extra { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; z-index: 4; animation: rise .3s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Sheets and toasts inside a stage */
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 28px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; z-index: 10; max-height: calc(100% - 16px); overflow: auto; animation: up .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0; font: 700 18px/1.2 var(--round); }
  .sheet p { margin: 0; color: var(--muted); font-size: 13px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: inline-block; border-radius: 999px; padding: 8px 13px; background: rgba(14, 27, 29, .06); font-size: 14px; cursor: pointer; }
  .seg input:checked + span { background: var(--teal); color: #fff; }
  .seg input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; border: 0; border-radius: 999px; padding: 13px; font-weight: 600; cursor: pointer; background: rgba(14,27,29,.06); color: var(--ink); }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .toast { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 110px); left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; z-index: 12; animation: rise .3s ease-out; }

  /* Playable end card */
  .game { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 170px; }
  .game .hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 110px); left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .game .go { position: absolute; left: 20px; right: 20px; bottom: 92px; border: 0; border-radius: 999px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer; }
  .layer { height: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .mover { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 170px); height: 20px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .stack { display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; width: 100%; }
  .flash { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; font: 800 30px/1 var(--round); color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); pointer-events: none; transition: opacity .2s, transform .25s; }
  .flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .flash.good { color: #b8fff4; }
  .flash.bad { color: #ffd0cc; }
  .score { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 110px); left: 50%; transform: translateX(-50%); border-radius: 22px; padding: 10px 18px; display: flex; flex-direction: column; align-items: center; z-index: 4; animation: rise .3s ease-out; }
  .score b { font: 800 34px/1 var(--round); color: var(--teal); font-variant-numeric: tabular-nums; }
  .score span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .cup { position: relative; width: 150px; height: 200px; border-radius: 0 0 48px 48px; overflow: hidden; background: rgba(255,255,255,.3); border: 3px solid rgba(255,255,255,.92); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
  .line { position: absolute; left: -8px; right: -8px; border-top: 2px dashed #fff; transition: bottom .3s; }
  .plate { width: 70%; height: 8px; border-radius: 4px; background: rgba(255,255,255,.85); }

  /* State sheet (page level) */
  .scrim { position: fixed; inset: 0; background: rgba(14, 27, 29, .2); z-index: 30; }
  .panel { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin-inline: auto; max-height: 70svh; overflow: auto; border-radius: 30px; padding: 18px; z-index: 31; display: flex; flex-direction: column; gap: 14px; }
  .panel h4 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .list s { color: var(--muted); text-decoration-color: var(--bad); }
  .req { display: flex; justify-content: space-between; gap: 10px; }
  .st { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: rgba(14,27,29,.06); white-space: nowrap; align-self: start; }
  .st.rendering { color: var(--warn); } .st.ready { color: var(--teal); background: var(--teal-soft); } .st.failed, .st.moderated { color: var(--bad); }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
</style>

<div class="wrap">
  <header class="top">
    <div class="logo glass light">fog<i>feed</i></div>
    <button class="pillbtn glass light press" id="open-state" aria-haspopup="dialog"><span class="dot" id="live"></span>State</button>
  </header>
  <main class="feed" id="feed" aria-label="Ad feed"></main>
</div>

<script>
const TRIGGER = "trig_014YGcJ8LTusLYpj2ULMqQNh";
const I = {
  play: '<path d="M7 5l12 7-12 7z"/>',
  mine: '<path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.6-.8z"/>',
  next: '<path d="M5 5l9 7-9 7zM17 5v14"/>',
  star: '<circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  mute: '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/>',
  sound: '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8c1.5 1.2 1.5 6.8 0 8"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const BRAND = {
  sutro: { name: "Sutro Stack", note: "fictional", title: "Stack the burger",
    layers: [["bun", "#e3a857"], ["patty", "#6d3f26"], ["cheese", "#f2c230"], ["patty", "#6d3f26"], ["top bun", "#e3a857"]], menu: { bun: ["sourdough", "brioche", "sesame"], cheese: ["cheddar", "pepper jack", "swiss"], extra: ["grilled onions", "jalapeños", "bacon"] } },
  sightglass: { name: "Sightglass", note: "spec ad", title: "Pour the latte",
    pours: [["espresso", "#4a2c1d"], ["milk", "#e7d3b8"], ["foam", "#fbf8f2"]], menu: { drink: ["latte", "cortado", "cold brew"], milk: ["whole", "oat", "none"], temp: ["hot", "iced"] } }
};

let db = null, mcp = null, ads = [], reqs = [], state = { taps: {} }, soundOn = false;
// Two homes for the same page: inside claude.ai (artifact db + assets) or on CloudFront (S3 files + /api Lambda).
const HOSTED = typeof window.claude === "undefined";
const media = c => c.asset ? "/_blob/" + c.asset : "media/" + c.file;
const api = (path, body) => fetch("api/" + path, body === undefined ? { cache: "no-store" } :
  { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(async r => ({ ok: r.ok, data: await r.json().catch(() => ({})) }));
const posts = new Map();
const brandOf = a => a.brand || (String(a.id).startsWith("sightglass") ? "sightglass" : "sutro");

// ---------- feed ----------
function renderFeed() {
  const mine = reqs.filter(r => r.status === "ready" && (r.asset || r.file))
    .sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""))
    .map(r => ({ id: r.clip || r.id, key: "req-" + r.id, brand: r.payload?.brand || "sutro", asset: r.asset, file: r.file, forYou: true,
                 story: r.payload?.story || r.payload?.parent, episode: r.payload?.episode }));
  const items = [...mine, ...ads.filter(a => !a.hidden).map(a => ({ ...a, key: a.id }))];
  const feed = $("#feed"), want = new Set(items.map(i => i.key));
  for (const [k, el] of posts) if (!want.has(k)) { el.remove(); posts.delete(k); }
  items.forEach((item, i) => {
    let el = posts.get(item.key);
    if (!el) { el = document.createElement("article"); el.className = "post"; el.innerHTML = '<div class="stage"></div>'; mount($(".stage", el), item); posts.set(item.key, el); }
    if (feed.children[i] !== el) feed.insertBefore(el, feed.children[i] || null);
  });
  observe();
}

// A post = the clip + the same chrome every time: brand chip, sound, four actions.
function mount(stage, a, clip, afterEnd) {
  stage.innerHTML = ""; stage.classList.remove("frozen");
  const b = BRAND[brandOf(a)];
  const v = document.createElement("video");
  v.src = media(clip || a); v.muted = !soundOn; v.playsInline = true; v.preload = "metadata";
  stage.appendChild(v);
  stage.insertAdjacentHTML("beforeend", `
    <div class="chip glass">${a.forYou ? "For you" : esc(b.name)} <small>${a.forYou ? esc(b.name) : esc(b.note)}</small></div>
    ${a.warning ? `<div class="chip glass warn">${esc(a.warning)}</div>` : ""}
    ${a.score ? `<div class="score glass light"><b>${a.score.score}</b><span>${{ win: "Perfect stack", almost: "So close", retry: "Try again" }[a.score.outcome]} · best ${a.score.best}</span></div>` : ""}
    <button class="sound glass press" aria-label="Sound">${svg(soundOn ? "sound" : "mute")}</button>
    <nav class="bar glass" aria-label="Actions">
      <button class="press" data-act="play">${svg("play")}Play</button>
      <button class="press" data-act="mine">${svg("mine")}Mine</button>
      <button class="press" data-act="next">${svg("next")}Next</button>
      <button class="press" data-act="star">${svg("star")}Star</button>
    </nav>`);
  $(".sound", stage).onclick = () => {
    soundOn = !soundOn;
    document.querySelectorAll("video").forEach(x => x.muted = !soundOn || x !== v);
    document.querySelectorAll(".sound").forEach(s => s.innerHTML = svg(soundOn ? "sound" : "mute"));
    if (soundOn) { v.currentTime = 0; v.play().catch(() => {}); }
  };
  stage.querySelectorAll(".bar button").forEach(btn => btn.onclick = () => act(btn.dataset.act, a, stage, v));
  // Timed extra from the script (a branch), one at most, above the bar.
  let shown = false;
  v.addEventListener("timeupdate", () => {
    const o = (a.extra && v.currentTime >= a.extra.at) ? a.extra : null;
    if (!!o === shown) return; shown = !!o;
    $(".extra", stage)?.remove();
    if (o) { const e = document.createElement("button"); e.className = "extra glass press"; e.textContent = o.label;
      e.onclick = () => { tap(a.id, o.label); const t = ads.find(x => x.id === o.to); if (t) { mount(stage, { ...t, brand: brandOf(a) }); play(stage); } };
      stage.appendChild(e); }
  });
  // Every clip ends in the playable end card, unless it is an end card itself.
  v.addEventListener("ended", () => afterEnd ? afterEnd() : offer(stage, a));
  v.addEventListener("error", () => toast(stage, "Clip didn't load. Reload to retry."));
}

// When a clip ends: offer the playable, and move on by itself if nobody taps.
function offer(stage, a, label = "Play") {
  $(".offer", stage)?.remove();
  const o = document.createElement("div"); o.className = "offer glass light";
  const title = BRAND[brandOf(a)].title;
  o.innerHTML = `<b>${esc(title)}</b><div class="row"><button class="btn primary press" data-p>${esc(label)}</button><button class="btn press" data-n>Next</button></div><small>Next in <span>4</span></small>`;
  stage.appendChild(o);
  let t = 4;
  const tick = setInterval(() => { t--; const sp = $("small span", o); if (sp) sp.textContent = t; if (t <= 0) { clearInterval(tick); o.remove(); goNext(stage); } }, 1000);
  o._stop = () => clearInterval(tick);
  $("[data-p]", o).onclick = () => { o._stop(); o.remove(); tap(a.id, "end card play"); startGame(stage, a); };
  $("[data-n]", o).onclick = () => { o._stop(); o.remove(); goNext(stage); };
}
function clearOffer(stage) { const o = $(".offer", stage); if (o) { o._stop?.(); o.remove(); } }

function goNext(stage, step = 1) {
  const feed = $("#feed"), list = [...feed.children], i = list.indexOf(stage.closest(".post"));
  const j = (i + step + list.length) % list.length;  // wraps to the top after the last clip
  feed.scrollTo({ top: j * feed.clientHeight, behavior: "smooth" });
}

document.addEventListener("keydown", e => {
  if (e.target.closest?.("input, textarea, form")) return;
  const cur = document.querySelector(".post.active .stage");
  if (!cur) return;
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); goNext(cur, 1); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); goNext(cur, -1); }
});

function play(stage) { const v = $("video", stage); if (v) { v.muted = !soundOn; v.play().catch(() => {}); } }

function act(kind, a, stage, v) {
  tap(a.id, kind);
  if (kind === "play") { v.pause(); startGame(stage, a); }
  if (kind === "mine") { v.pause(); orderSheet(stage, a); }
  if (kind === "next") nextEpisode(stage, a);
  if (kind === "star") { v.pause(); selfieSheet(stage, a); }
}

function toast(stage, text) {
  $(".toast", stage)?.remove();
  const t = document.createElement("div"); t.className = "toast glass tint"; t.textContent = text; t.setAttribute("role", "status");
  stage.appendChild(t); setTimeout(() => t.remove(), 3200);
}

function sheet(stage, html) {
  $(".sheet", stage)?.remove();
  const s = document.createElement("form"); s.className = "sheet glass light"; s.innerHTML = html;
  stage.appendChild(s); $("[data-close]", s)?.addEventListener("click", () => s.remove());
  return s;
}

// ---------- Idea 8: playable end card on every clip ----------
function startGame(stage, a) {
  stage.querySelectorAll(".sheet,.game,.extra").forEach(x => x.remove());
  stage.classList.add("frozen");
  const brand = brandOf(a), g = document.createElement("div"); g.className = "game";
  stage.appendChild(g);
  (BRAND[brand].pours ? pourGame : stackGame)(g, stage, BRAND[brand], (outcome, score) => {
    tap(a.id, "game " + outcome);
    const best = Math.max(score, (state.best || {})[brand] || 0);
    saveState({ last_game: { brand, outcome, score }, best: { ...(state.best || {}), [brand]: best } });
    const card = ads.find(x => x.id === `${brand === "sightglass" ? "sightglass" : "sutrostack"}__endcard_${outcome}`);
    if (!card) { toast(stage, "End card not ready yet"); stage.classList.remove("frozen"); g.remove(); return; }
    mount(stage, { ...a, extra: null, warning: null, score: { score, best, outcome } }, card, () => offer(stage, a, "Play again"));
    play(stage);
  });
}

// Five drops. Each scores 0-100 by how centred it lands; a near-perfect drop adds a combo bonus.
function stackGame(g, stage, cfg, done) {
  const L = cfg.layers;
  g.innerHTML = `<div class="hud glass">${esc(cfg.title)} · <b class="pts">0</b></div><div class="flash"></div><div class="mover"></div>
    <div class="stack"></div><div class="plate"></div>
    <button class="go glass tint press">Drop the ${esc(L[0][0])}</button>`;
  const mover = $(".mover", g), stack = $(".stack", g), go = $(".go", g), pts = $(".pts", g), flash = $(".flash", g);
  let i = 0, x = 0, dir = 1, raf = 0, total = 0, combo = 0, speed = .010;
  const W = () => stage.clientWidth, LW = () => W() * .55;
  const set = () => { mover.style.width = LW() + "px"; mover.style.background = L[i][1]; x = 0; };
  const loop = () => { x += dir * W() * speed; if (x < 0 || x > W() - LW()) dir *= -1; mover.style.left = x + "px"; raf = requestAnimationFrame(loop); };
  const say = (t, cls) => { flash.textContent = t; flash.className = "flash show " + (cls || ""); setTimeout(() => flash.className = "flash", 650); };
  set(); loop();
  go.onclick = () => {
    const off = (x - (W() - LW()) / 2) / LW(), miss = Math.abs(off);
    let p = Math.max(0, Math.round(100 - miss * 400));
    if (miss < .03) { combo++; p += 10 * combo; say(combo > 1 ? `Perfect ×${combo}` : "Perfect!", "good"); }
    else { combo = 0; say(p >= 70 ? "Nice" : p > 0 ? "Wobbly" : "Miss", p > 0 ? "" : "bad"); }
    total += p; pts.textContent = total;
    const d = document.createElement("div"); d.className = "layer";
    d.style.cssText = `width:${LW()}px;background:${L[i][1]};transform:translateX(${off * LW()}px)`; stack.appendChild(d);
    if (++i < L.length) { go.textContent = "Drop the " + L[i][0]; speed += .0025; set(); return; }
    cancelAnimationFrame(raf); go.disabled = true;
    const avg = total / L.length;
    setTimeout(() => done(avg >= 80 ? "win" : avg >= 50 ? "almost" : "retry", total), 700);
  };
}

// Three pours into one cup. Hold to pour, let go at the dashed line. Each pour scores 0-100 by how close
// it stops to the line; spilling past it scores 0. Back-to-back near-perfect pours add a combo bonus.
function pourGame(g, stage, cfg, done) {
  const P = cfg.pours, targets = [.34, .68, .9].map(t => t + (Math.random() - .5) * .08);
  g.innerHTML = `<div class="hud glass">${esc(cfg.title)} · <b class="pts">0</b></div><div class="flash"></div>
    <div class="cup">${P.map((_, k) => `<div class="fill" data-k="${k}"></div>`).join("")}<div class="line"></div></div>
    <button class="go glass tint press">Hold to pour ${esc(P[0][0])}</button>`;
  const cup = $(".cup", g), line = $(".line", g), go = $(".go", g), pts = $(".pts", g), flash = $(".flash", g);
  const fills = [...g.querySelectorAll(".fill")];
  let i = 0, base = 0, level = 0, raf = 0, pouring = false, total = 0, combo = 0, locked = false;
  const say = (t, cls) => { flash.textContent = t; flash.className = "flash show " + (cls || ""); setTimeout(() => flash.className = "flash", 650); };
  const setLine = () => { line.style.bottom = targets[i] * 100 + "%"; fills[i].style.background = P[i][1]; fills[i].style.bottom = base * 100 + "%"; };
  const step = () => { if (!pouring) return; level = Math.min(1.02, level + .0045 + i * .0012); fills[i].style.height = (level - base) * 100 + "%"; if (level >= 1.02) stop(); else raf = requestAnimationFrame(step); };
  const start = e => { e.preventDefault(); if (locked) return; pouring = true; step(); };
  const stop = () => {
    if (!pouring) return; pouring = false; cancelAnimationFrame(raf); locked = true;
    const miss = level - targets[i];
    let p = miss > .05 ? 0 : Math.max(0, Math.round(100 - Math.abs(miss) * 600));
    if (Math.abs(miss) < .015) { combo++; p += 10 * combo; say(combo > 1 ? `Perfect ×${combo}` : "Perfect!", "good"); }
    else { combo = 0; say(miss > .05 ? "Spill!" : p >= 70 ? "Nice" : "Short", miss > .05 ? "bad" : ""); }
    total += p; pts.textContent = total;
    base = Math.min(level, targets[i] + .05);
    setTimeout(() => {
      if (++i < P.length) { level = base; locked = false; go.textContent = "Hold to pour " + P[i][0]; setLine(); return; }
      go.disabled = true;
      const avg = total / P.length;
      done(avg >= 80 ? "win" : avg >= 50 ? "almost" : "retry", total);
    }, 600);
  };
  setLine();
  go.addEventListener("pointerdown", start); go.addEventListener("pointerup", stop); go.addEventListener("pointerleave", stop); go.addEventListener("pointercancel", stop);
  go.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
  go.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); });
}

// ---------- Idea 1: make it mine ----------
function orderSheet(stage, a) {
  const brand = brandOf(a), menu = BRAND[brand].menu, cur = (state.orders || {})[brand] || {};
  const s = sheet(stage, `<h3>Make it yours</h3>
    ${Object.entries(menu).map(([k, vals]) => `<div class="seg" role="radiogroup" aria-label="${k}">${vals.map((v, j) =>
      `<label><input type="radio" id="m-${brand}-${k}-${j}" name="${k}" value="${esc(v)}" ${(cur[k] || vals[0]) === v ? "checked" : ""}><span>${esc(v)}</span></label>`).join("")}</div>`).join("")}
    <p>Your next ad shows exactly this.</p>
    <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Make my ad</button></div>`);
  s.addEventListener("submit", async e => {
    e.preventDefault();
    const pick = Object.fromEntries(new FormData(s)); s.remove();
    const prev = (state.orders || {})[brand];
    await saveState({ orders: { ...(state.orders || {}), [brand]: pick }, drop: prev ? `${brand} order ${Object.values(prev).join(" · ")}` : null });
    await request("order", { brand, ...pick }, `${BRAND[brand].name} · ${Object.values(pick).join(" · ")}`, stage);
  });
}

// ---------- Idea 6: next episode, from the clip you just watched ----------
async function nextEpisode(stage, a) {
  const saga = state.saga && state.saga.clip === a.id ? state.saga : { clip: a.id, n: a.episode || 1, story: a.story || a.id };
  if (saga.n >= 4) { toast(stage, "Season finale reached"); return; }
  await request("episode", { brand: brandOf(a), parent: a.id, story: saga.story || a.story || a.id, episode: saga.n + 1 }, `Episode ${saga.n + 1} · ${BRAND[brandOf(a)].name}`, stage);
}

// ---------- Idea 7: star in it ----------
function selfieSheet(stage, a) {
  const brand = brandOf(a);
  const s = sheet(stage, `<h3>Star in the next ad</h3>
    <label class="check"><input type="checkbox" id="consent-${esc(a.id)}"> <span>I'm 18+, this is me, and it's sent to Black Forest Labs for one render, then deleted.</span></label>
    <input type="file" accept="image/jpeg,image/png" hidden>
    <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-pick disabled>Choose photo</button></div>`);
  const c = $("input[type=checkbox]", s), pick = $("[data-pick]", s), file = $("input[type=file]", s);
  c.onchange = () => pick.disabled = !c.checked;
  pick.onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast(stage, "Photo must be under 8 MB"); return; }
    if (HOSTED && f.size > 4 * 1024 * 1024) { toast(stage, "Photo must be under 4 MB"); return; }
    const assets = HOSTED ? null : await claude.use("assets");
    if (!HOSTED && !assets) { toast(stage, "Only the feed owner can upload"); return; }
    pick.disabled = true; pick.textContent = "Uploading…";
    try {
      const payload = { brand };
      if (HOSTED) payload.image_b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(f); });
      else payload.selfie_asset = (await assets.upload(f)).id;
      s.remove(); await request("selfie", payload, `Starring you · ${BRAND[brand].name}`, stage);
    }
    catch (e) { pick.disabled = false; pick.textContent = "Choose photo"; toast(stage, `Upload failed (${e.code || "error"})`); }
  };
}

// ---------- requests, state, taps ----------
async function request(kind, payload, title, stage) {
  if (HOSTED) {
    toast(stage, "Sending…");
    const r = await api("request", { kind, payload, title }).catch(() => ({ ok: false, data: {} }));
    if (!r.ok) { toast(stage, r.data.message || "Couldn't start the render"); return; }
    reqs = [...reqs, r.data]; renderPanel();
    toast(stage, "Rendering your ad · ~3 min"); return;
  }
  if (!db) { toast(stage, "Data store unavailable here"); return; }
  const ref = db.collection("requests").doc();
  try { await ref.set({ kind, payload, title, status: "queued", created_at: new Date().toISOString() }); }
  catch (e) { toast(stage, `Couldn't queue (${e.code})`); return; }
  toast(stage, "Rendering your ad · ~3 min");
  if (mcp) mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER, text: `feed request ${ref.id} (${kind})` }).catch(() => {});
}

async function saveState(patch) {
  const next = { ...state, ...patch };
  if (patch.drop) next.dropped = [...(state.dropped || []), patch.drop].slice(-8);
  delete next.drop;
  state = next; renderPanel();
  if (HOSTED) api("state", next).catch(() => {});
  else if (db) try { await db.doc("state/viewer").set(next); } catch {}
}

let tapTimer = null, pending = {};
function tap(post, action) {
  const k = `${post} · ${action}`; pending[k] = (pending[k] || 0) + 1;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { const taps = { ...(state.taps || {}) }; for (const [key, n] of Object.entries(pending)) taps[key] = (taps[key] || 0) + n; pending = {}; saveState({ taps }); }, 800);
}

// ---------- state sheet ----------
let panelOpen = false;
function renderPanel() {
  const busy = reqs.some(r => r.status === "queued" || r.status === "rendering");
  $("#live").style.background = busy ? "var(--warn)" : "var(--teal)";
  if (!panelOpen) return;
  const kept = [["viewer", "SoMa · lunch · 68°F"]];
  for (const [b, o] of Object.entries(state.orders || {})) kept.push([BRAND[b]?.name || b, Object.values(o).join(" · ")]);
  if (state.saga) kept.push(["episode", `${state.saga.n} of ${state.saga.clip}`]);
  if (state.last_game) kept.push(["last game", `${state.last_game.score ?? "-"} · ${state.last_game.outcome} (${BRAND[state.last_game.brand]?.name || state.last_game.brand})`]);
  for (const [b, v] of Object.entries(state.best || {})) kept.push([`best · ${BRAND[b]?.name || b}`, String(v)]);
  const r = [...reqs].sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")).slice(0, 6);
  const t = Object.entries(state.taps || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);
  $(".panel").innerHTML = `
    <h4>Kept</h4><dl class="kv">${kept.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <h4>Dropped</h4><div class="list">${(state.dropped || []).length ? state.dropped.map(d => `<s>${esc(d)}</s>`).join("") : '<span class="muted">Nothing yet</span>'}</div>
    <h4>Renders</h4><div class="list">${r.length ? r.map(x => `<div class="req"><span>${esc(x.title || x.kind)}</span><span class="st ${esc(x.status)}">${esc(x.status)}</span></div>`).join("") : '<span class="muted">None yet</span>'}</div>
    <p class="note">Spec ads · Sightglass not affiliated · Sutro Stack is fictional · every clip is FLUX 3</p>
    <h4>Taps</h4><div class="list">${t.length ? t.map(([k, n]) => `<div class="req"><span>${esc(k)}</span><b>${n}</b></div>`).join("") : '<span class="muted">None yet</span>'}</div>
    <button class="btn" type="button" id="close-state">Close</button>`;
  $("#close-state").onclick = closePanel;
}
function openPanel() {
  panelOpen = true;
  document.body.insertAdjacentHTML("beforeend", '<div class="scrim"></div><section class="panel glass light" role="dialog" aria-label="State"></section>');
  $(".scrim").onclick = closePanel; renderPanel();
}
function closePanel() { panelOpen = false; $(".scrim")?.remove(); $(".panel")?.remove(); }
$("#open-state").onclick = openPanel;

// Autoplay whichever post is in view.
let io = null;
function observe() {
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    const v = $("video", e.target), post = e.target.closest(".post");
    if (e.isIntersecting && e.intersectionRatio > .6) {
      post.classList.add("active");
      if (v && !e.target.classList.contains("frozen")) { v.muted = !soundOn; if (v.ended) v.currentTime = 0; v.play().catch(() => {}); }
    } else { post.classList.remove("active"); clearOffer(e.target); if (v) v.pause(); }
  }), { root: $("#feed"), threshold: [0, .6, 1] });
  document.querySelectorAll(".stage").forEach(s => io.observe(s));
}

async function startHosted() {
  ads = await fetch("data/ads.json").then(r => r.json()).catch(() => []);
  const s = await api("state").catch(() => null);
  if (s?.ok) state = { taps: {}, ...s.data };
  renderFeed(); renderPanel();
  const poll = async () => {
    const r = await api("requests").catch(() => null);
    if (r?.ok) {
      const had = new Set(reqs.filter(x => x.status === "ready").map(x => x.id));
      reqs = r.data;
      if (reqs.some(x => x.status === "ready" && !had.has(x.id))) { const s2 = await api("state").catch(() => null); if (s2?.ok) state = { taps: {}, ...s2.data }; }
      renderFeed(); renderPanel();
    }
    setTimeout(poll, reqs.some(x => x.status === "rendering") ? 8000 : 20000);
  };
  poll();
}

(async function start() {
  if (HOSTED) return startHosted();
  db = await claude.use("db");
  mcp = await claude.use("mcp");
  if (!db) { $("#feed").innerHTML = '<p class="muted">This view can’t reach the feed’s data.</p>'; return; }
  db.collection("ads").orderBy("order").onSnapshot(s => { ads = s.docs.map(d => ({ id: d.id, ...d.data() })); renderFeed(); });
  db.collection("requests").onSnapshot(s => { reqs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderFeed(); renderPanel(); });
  db.doc("state/viewer").onSnapshot(s => { if (s.exists) { state = { taps: {}, ...s.data() }; renderPanel(); } });
})();
</script>

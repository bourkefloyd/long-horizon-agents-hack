[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-local-ad-generator"
version = "0.1.0"
description = "Generate local-news-reactive video ad concepts using Nimble and BFL FLUX 3 Video."
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
viral-local-ads = "viral_local_ad_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

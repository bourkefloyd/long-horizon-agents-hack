[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-loop-service"
version = "0.1.0"
description = "Compact-state campaign signal and decision service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "google-cloud-storage>=2.18.0,<4",
  "uvicorn[standard]>=0.30.0,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0,<1",
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: LH campaign-gen

# Thin target caller. Shared routing and execution live in lh-target.yml and
# lh-run.yml; this file only declares triggers, manual inputs, and the target.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to work on (0 = manual run, no issue comment)"
        required: false
        type: string
        default: "0"
      instruction:
        description: "One-shot instruction for this run"
        required: false
        type: string
        default: ""
      model:
        description: "Cursor CLI model override (blank uses target config)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  route:
    # GitHub cannot filter issues.labeled by label name, so every lh:* label
    # wakes every caller. Skip the whole run here unless the event is for this
    # target; lh-target.yml re-checks author/PR rules on the events that pass.
    # The actor check keeps the runner's own status comments and label edits
    # from ever waking a caller (GITHUB_TOKEN events already do not, but a
    # PAT swapped in later would).
    if: >-
      github.actor != 'github-actions[bot]'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues'
          && github.event.label.name == 'lh:campaign-gen')
      || (github.event_name == 'issue_comment'
          && !github.event.issue.pull_request
          && contains(github.event.issue.labels.*.name, 'lh:campaign-gen')))
    uses: ./.github/workflows/lh-target.yml
    with:
      target: campaign-gen
      issue_number: ${{ inputs.issue_number }}
      instruction: ${{ inputs.instruction || '' }}
      model: ${{ inputs.model || '' }}
    secrets: inherit

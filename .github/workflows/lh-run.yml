name: LH run (reusable)

# One long-horizon run of the Cursor CLI against a target under .lh/.
# The agent step only edits files. Branching, committing, pushing, PR
# open/update, and the issue comment are deterministic steps below.
# Design note: docs/lh-workflow.md. State layout: .lh/README.md.

on:
  workflow_call:
    inputs:
      target:
        description: "Target directory under .lh/"
        required: true
        type: string
      issue_number:
        description: "Issue that owns this run (0 for a manual run)"
        required: false
        type: number
        default: 0
      instruction:
        description: "Extra one-shot instruction (text after /lh in a comment)"
        required: false
        type: string
        default: ""
      model:
        description: "Workflow override for the Cursor CLI model slug"
        required: false
        type: string
        default: ""
      state_max_lines:
        description: "Hard cap on .lh/<target>/state.md line count"
        required: false
        type: number
        default: 80
      keep_logs:
        description: "How many run logs to keep in .lh/log/"
        required: false
        type: number
        default: 5
    secrets:
      CURSOR_API_KEY:
        required: true
      NIMBLE_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    name: lh-${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lh-${{ inputs.target }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      MODEL_OVERRIDE: ${{ inputs.model }}
      DEFAULT_MODEL: grok-4.7-high
      STATE_MAX_LINES: ${{ inputs.state_max_lines }}
      KEEP_LOGS: ${{ inputs.keep_logs }}
      BASE_REF: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate inputs
        run: |
          echo "STATUS_FILE=$RUNNER_TEMP/issue-status.md" >> "$GITHUB_ENV"
          case "$TARGET" in
            ""|*[!a-z0-9-]*|-*|*-)
              echo "::error::target must contain only lowercase letters, numbers, and internal hyphens: '$TARGET'"
              exit 1 ;;
          esac
          if [ "$BASE_REF" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::notice::Running on non-default ref '$BASE_REF' (smoke or test run). PR base will be '$BASE_REF'."
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No git credentials on disk: the agent step cannot push even if it
          # found a way around the shell deny list. Publish uses the token
          # explicitly on the URL.
          persist-credentials: false

      - name: Resolve work branch
        id: branch
        run: |
          if [ "$ISSUE_NUMBER" != "0" ]; then
            BRANCH="lh/${TARGET}/issue-${ISSUE_NUMBER}"
          else
            BRANCH="lh/${TARGET}/manual-${{ github.run_id }}"
          fi
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "::error::refusing to work directly on $BRANCH"; exit 1
          fi
          # Continue an unmerged PR branch if one exists so the state file
          # carries over between runs before merge.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -B "$BRANCH"
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Work branch: $BRANCH"

      - name: Check target files
        run: |
          [ -d ".lh/$TARGET" ] || { echo "::error::unknown target '$TARGET'"; exit 1; }
          for f in ".lh/$TARGET/prompt.md" ".lh/$TARGET/state.md" ".lh/$TARGET/checks.sh" ".cursor/cli.json"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          bash .lh/bin/check-state.sh ".lh/$TARGET/state.md" "$STATE_MAX_LINES" \
            || { echo "::error::state.md on the branch is already invalid; fix it by hand"; exit 1; }
          cp ".lh/$TARGET/state.md" "$RUNNER_TEMP/state.before.md"

      - name: Resolve model
        id: model
        run: |
          CONFIG_MODEL=""
          if [ -f ".lh/$TARGET/config.json" ]; then
            CONFIG_MODEL=$(jq -er '
              (.model // "") as $model |
              if ($model | type) == "string" then $model
              else error("model must be a string")
              end
            ' ".lh/$TARGET/config.json")
          fi
          MODEL="${MODEL_OVERRIDE:-${CONFIG_MODEL:-$DEFAULT_MODEL}}"
          case "$MODEL" in
            ""|*[!A-Za-z0-9._-]*)
              echo "::error::invalid Cursor CLI model slug '$MODEL'"
              exit 1 ;;
          esac
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Chosen model: $MODEL"

      - name: Mark issue running (status comment)
        # One comment per run, edited in place below. Failures here only warn:
        # status is a courtesy and must never block the run itself.
        if: inputs.issue_number != 0
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RESUMED: ${{ steps.branch.outputs.resumed }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label lh:running --remove-label lh:review,lh:failed \
            || echo "::warning::could not set lh:running (do the lh:running/lh:review/lh:failed labels exist?)"
          BRANCH_STATE=new; [ "$RESUMED" = "true" ] && BRANCH_STATE=resumed
          HEADER="**LH ${TARGET}** run [${{ github.run_id }}](${RUN_URL}) · model \`${MODEL}\` · branch \`${BRANCH}\` (${BRANCH_STATE})"$'\n\n'"Comment \`/lh <instruction>\` on this issue to run again once this finishes."
          if ID=$(bash .lh/bin/issue-status.sh init "$HEADER"); then
            echo "STATUS_COMMENT_ID=$ID" >> "$GITHUB_ENV"
            echo "Status comment: $ID"
          else
            echo "::warning::could not create the status comment"
          fi

      - name: Fetch issue text
        if: inputs.issue_number != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body \
            --jq '"# Issue #\(.number): \(.title)\n\n\(.body // "")"' \
            > "$RUNNER_TEMP/issue.md"
          wc -l "$RUNNER_TEMP/issue.md"

      - name: Compose prompt
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          bash .lh/bin/compose-prompt.sh "$TARGET" "$RUNNER_TEMP/issue.md" "$KEEP_LOGS" "$STATE_MAX_LINES" "$INSTRUCTION" \
            > "$RUNNER_TEMP/prompt.txt"
          echo "Prompt: $(wc -l < "$RUNNER_TEMP/prompt.txt") lines, $(wc -c < "$RUNNER_TEMP/prompt.txt") bytes"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run agent (restricted, file edits only)
        id: agent
        # No GH token or git credentials. Nimble's key is target-scoped.
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NIMBLE_API_KEY: ${{ inputs.target == 'campaign-gen' && secrets.NIMBLE_API_KEY || '' }}
        run: |
          set -o pipefail
          agent --version
          agent models | tee "$RUNNER_TEMP/models.txt"
          echo "Cursor agent init: target=$TARGET model=$MODEL"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          agent -p --force --trust --output-format text --model "$MODEL" "$(cat "$RUNNER_TEMP/prompt.txt")" \
            2>&1 | tee "$RUNNER_TEMP/agent-output.txt"

      - name: Discard edits outside the allowed surface
        # Belt and braces on top of .cursor/cli.json deny rules.
        run: |
          git checkout -- .github .cursor 2>/dev/null || true
          git clean -fdq -- .github .cursor 2>/dev/null || true
          find . -path ./.git -prune -o -name '.env*' -newer "$RUNNER_TEMP/prompt.txt" -type f -print -exec rm -f {} + 2>/dev/null || true
          rm -rf .lh/log/*.tmp 2>/dev/null || true
          echo "Changed files:"; git status --short

      - name: Status milestone (agent finished)
        if: inputs.issue_number != 0 && env.STATUS_COMMENT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(git status --short | wc -l | tr -d ' ')
          bash .lh/bin/issue-status.sh update running "agent finished; ${N} file(s) changed" \
            || echo "::warning::status update failed"

      - name: Capture approval request
        id: approval
        run: |
          REQUEST=".lh/$TARGET/approval-request.md"
          if [ -f "$REQUEST" ]; then
            cp "$REQUEST" "$RUNNER_TEMP/approval-request.md"
            rm -f "$REQUEST"
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "Approval requested; the request file will not be committed."
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce state file contract
        id: state
        run: |
          set +e
          bash .lh/bin/check-state.sh ".lh/$TARGET/state.md" "$STATE_MAX_LINES" > "$RUNNER_TEMP/state-check.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/state-check.txt"
          if [ $rc -ne 0 ]; then
            echo "::warning::state.md rewrite rejected; restoring previous version"
            cp "$RUNNER_TEMP/state.before.md" ".lh/$TARGET/state.md"
            echo "result=rejected" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Run target checks
        id: checks
        continue-on-error: true
        env:
          NIMBLE_API_KEY: ${{ inputs.target == 'campaign-gen' && secrets.NIMBLE_API_KEY || '' }}
        run: |
          set -o pipefail
          bash ".lh/$TARGET/checks.sh" 2>&1 | tee "$RUNNER_TEMP/checks-output.txt"

      - name: Status milestone (checks)
        if: inputs.issue_number != 0 && env.STATUS_COMMENT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          STATE_RESULT: ${{ steps.state.outputs.result }}
        run: |
          bash .lh/bin/issue-status.sh update running "checks: ${CHECKS_OUTCOME}; state.md: ${STATE_RESULT}" \
            || echo "::warning::status update failed"

      - name: Write run log and prune
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          STATE_RESULT: ${{ steps.state.outputs.result }}
          USED_MODEL: ${{ steps.agent.outputs.model }}
          RESUMED: ${{ steps.branch.outputs.resumed }}
        run: |
          mkdir -p .lh/log
          LOG=".lh/log/${{ github.run_id }}.md"
          {
            echo "# Run ${{ github.run_id }}"
            echo
            echo "- date: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- target: $TARGET"
            echo "- issue: ${ISSUE_NUMBER}"
            echo "- model: ${USED_MODEL}"
            echo "- trigger: ${{ github.event_name }} on ${BASE_REF}"
            echo "- branch resumed: ${RESUMED}"
            echo "- checks: ${CHECKS_OUTCOME}"
            echo "- state.md: ${STATE_RESULT}"
            echo
            echo "## Files changed"
            echo
            git add -A -- . ':!.github' ':!.cursor' >/dev/null 2>&1 || true
            git diff --cached --stat -- . ':!.lh/log' | tail -n 20 | sed 's/^/    /'
            git reset -q
            echo
            echo "## Agent summary (tail)"
            echo
            tail -n 15 "$RUNNER_TEMP/agent-output.txt" | cut -c1-200 | sed 's/^/    /'
            if [ "$CHECKS_OUTCOME" != "success" ]; then
              echo
              echo "## Checks output (tail)"
              echo
              tail -n 15 "$RUNNER_TEMP/checks-output.txt" | cut -c1-200 | sed 's/^/    /'
            fi
            if [ "$STATE_RESULT" = "rejected" ]; then
              echo
              echo "## State rejection"
              echo
              sed 's/^/    /' "$RUNNER_TEMP/state-check.txt"
            fi
          } > "$LOG"
          bash .lh/bin/prune-logs.sh "$KEEP_LOGS"
          {
            echo "## LH run: $TARGET"
            echo
            echo "- model: \`${USED_MODEL}\`"
            echo "- checks: **${CHECKS_OUTCOME}**"
            echo "- state.md: **${STATE_RESULT}**"
            echo
            cat "$LOG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish branch and PR (deterministic)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          STATE_RESULT: ${{ steps.state.outputs.result }}
          USED_MODEL: ${{ steps.agent.outputs.model }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "::error::refusing to push to $BRANCH"; exit 1
          fi
          git config user.name "lh-bot"
          git config user.email "lh-bot@users.noreply.github.com"
          git add -A -- . ':!.github' ':!.cursor'
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE="lh(${TARGET}): run ${{ github.run_id }}"
          [ "$ISSUE_NUMBER" != "0" ] && TITLE="lh(${TARGET}): issue #${ISSUE_NUMBER}, run ${{ github.run_id }}"
          git commit -q -m "$TITLE" -m "checks: ${CHECKS_OUTCOME}; state.md: ${STATE_RESULT}; model: ${USED_MODEL}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            echo "Long-horizon run of target \`${TARGET}\` by the Cursor CLI (\`${USED_MODEL}\`)."
            echo
            [ "$ISSUE_NUMBER" != "0" ] && echo "Closes #${ISSUE_NUMBER}." && echo
            echo "- Latest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Checks: **${CHECKS_OUTCOME}**"
            echo "- state.md contract: **${STATE_RESULT}**"
            echo
            echo "Review \`.lh/${TARGET}/state.md\` and \`.lh/${TARGET}/prompt.md\` with the code: edits there take effect on the next run only after merge."
            echo
            echo "## Current state"
            echo
            cat ".lh/${TARGET}/state.md"
          } > "$BODY_FILE"

          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE_REF" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            set +e
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$BRANCH" \
              --title "$(git log -1 --format=%s | sed 's/, run [0-9]*$//')" --body-file "$BODY_FILE" 2> "$RUNNER_TEMP/pr-create.err")
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "::warning::gh pr create failed: $(cat "$RUNNER_TEMP/pr-create.err")"
              echo "::warning::If it says Actions may not create PRs, enable 'Allow GitHub Actions to create and approve pull requests' in repo Settings > Actions > General."
              PR_URL="${{ github.server_url }}/${{ github.repository }}/compare/${BASE_REF}...${BRANCH}?expand=1"
            fi
          else
            gh pr edit "$PR_URL" --body-file "$BODY_FILE"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL"

      - name: Status milestone (pull request)
        if: inputs.issue_number != 0 && env.STATUS_COMMENT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then LINE="pull request: ${PR_URL}"; else LINE="no file changes to publish"; fi
          bash .lh/bin/issue-status.sh update running "$LINE" || echo "::warning::status update failed"

      - name: Open approval issue
        id: approval_issue
        if: steps.approval.outputs.requested == 'true' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          case "$PR_URL" in
            "https://github.com/${GITHUB_REPOSITORY}/pull/"*) ;;
            *) echo "::error::approval requires a GitHub pull request, got '$PR_URL'"; exit 1 ;;
          esac

          SUMMARY=$(awk 'NF {print; exit}' "$RUNNER_TEMP/approval-request.md" \
            | sed -E 's/^#+[[:space:]]*//; s/[[:cntrl:]]//g' | cut -c1-100)
          [ -n "$SUMMARY" ] || SUMMARY="review ${TARGET} changes"
          if grep -Eqi '(authorization:|bearer[[:space:]]|api[_ -]?key[[:space:]]*[:=]|secret[[:space:]]*[:=]|token[[:space:]]*[:=])' \
            "$RUNNER_TEMP/approval-request.md"; then
            echo "::warning::approval request looked sensitive; using a generic summary"
            SUMMARY="review ${TARGET} changes"
          fi

          ASSIGNEE=$(jq -r --arg target "$TARGET" '.[$target] // .default // empty' .lh/owners.json)
          case "$ASSIGNEE" in
            ""|REPLACE_*|TODO*|UNKNOWN*) ASSIGNEE=$(jq -r '.default' .lh/owners.json) ;;
          esac

          APPROVAL_URL=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "lh:approval" --label "lh:${TARGET}" --limit 100 --json url,body \
            --jq "map(select((.body // \"\") | contains(\"PR: ${PR_URL}\")))[0].url // empty")
          if [ -z "$APPROVAL_URL" ]; then
            {
              echo "A human decision is required before this pull request may merge."
              echo
              echo "Target: \`${TARGET}\`"
              echo "PR: ${PR_URL}"
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "Review the pull request, then an assignee may comment \`/approve\` on this issue to squash-merge it."
              echo "The approval request content is intentionally omitted so secrets cannot be copied into an issue."
            } > "$RUNNER_TEMP/approval-issue.md"
            APPROVAL_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Approval needed: ${SUMMARY}" \
              --label "lh:approval" --label "lh:${TARGET}" --assignee "$ASSIGNEE" \
              --body-file "$RUNNER_TEMP/approval-issue.md")
          fi
          gh pr comment "$PR_URL" --repo "$GITHUB_REPOSITORY" \
            --body "Human approval is required: ${APPROVAL_URL}. An assignee must comment \`/approve\` there."
          echo "url=$APPROVAL_URL" >> "$GITHUB_OUTPUT"
          echo "Approval: $APPROVAL_URL"

      - name: Status milestone (approval issue)
        if: steps.approval_issue.outcome == 'success' && inputs.issue_number != 0 && env.STATUS_COMMENT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_URL: ${{ steps.approval_issue.outputs.url }}
        run: |
          bash .lh/bin/issue-status.sh update running "approval needed: ${APPROVAL_URL}" \
            || echo "::warning::status update failed"

      - name: Fail if checks failed
        if: steps.checks.outcome != 'success'
        run: |
          echo "::error::target checks failed; work was still published so the next run can see it"
          exit 1

      - name: Finish issue status (labels and summary)
        # Runs even after a crash so lh:running never sticks. Replaces the old
        # end-of-run comment: the status comment already carries the summary.
        if: always() && inputs.issue_number != 0
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          USED_MODEL: ${{ steps.agent.outputs.model }}
        run: |
          case "$JOB_STATUS" in
            success)
              if [ "$CHANGED" = "true" ]; then
                STATUS=review; ADD=lh:review; LINE="finished; ${PR_URL} is ready for review"
              else
                STATUS="done"; ADD=""; LINE="finished; nothing to review (no file changes)"
              fi ;;
            *)
              STATUS=failed; ADD=lh:failed
              LINE="run ${JOB_STATUS} (checks: ${CHECKS_OUTCOME:-not run}); see the [run log](${RUN_URL})"
              [ "$CHANGED" = "true" ] && LINE="${LINE}; work was still published at ${PR_URL}" ;;
          esac
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label lh:running ${ADD:+--add-label "$ADD"} \
            || echo "::warning::could not update status labels"
          if [ -z "${STATUS_COMMENT_ID:-}" ] && [ ! -f "$STATUS_FILE" ]; then
            # Start step never ran (early failure): give the fallback comment a header.
            { echo "**LH ${TARGET}** run [${{ github.run_id }}](${RUN_URL}) · model \`${USED_MODEL:-unresolved}\`"; echo; echo "Status: **${STATUS}**"; echo; } > "$STATUS_FILE"
          fi
          bash .lh/bin/issue-status.sh update "$STATUS" "$LINE" || echo "::warning::final status update failed"

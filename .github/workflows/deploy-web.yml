name: Deploy web to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_WEB_SERVICE || 'lh-web' }}
  REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://lh-campaign-service-row663omlq-uc.a.run.app' }}
  ADS_MANIFEST_URL: ${{ vars.ADS_MANIFEST_URL || 'https://storage.googleapis.com/lh-ads-assets-205515555985/manifest.json' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          FALLBACK_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION SERVICE REPOSITORY RUNTIME_SERVICE_ACCOUNT API_BASE_URL ADS_MANIFEST_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing deployment value for ${name}"
              exit 1
            fi
          done
          if [[ -z "${WIF_PROVIDER}" || -z "${DEPLOYER_SERVICE_ACCOUNT}" ]]; then
            if [[ -z "${FALLBACK_KEY}" ]]; then
              echo "::error::Configure both WIF variables or the GCP_SA_KEY fallback secret"
              exit 1
            fi
          fi

      - name: Authenticate with Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service account key
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}" \
            --build-arg "NEXT_PUBLIC_ADS_MANIFEST_URL=${ADS_MANIFEST_URL}" \
            --tag "${IMAGE}" \
            web
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
